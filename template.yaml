AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Look up an Apple Business device by serial number via the Apple Business API.

Parameters:
  SecretId:
    Type: String
    Description: >-
      Name (not ARN) of the Secrets Manager secret holding client_id, key_id and
      private_key_pem, e.g. abm/api-credentials.
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]+$'
    MinLength: 1
  AbmScope:
    Type: String
    Description: OAuth scope. business.api for Apple Business, school.api for Apple School Manager.
    Default: business.api
    AllowedValues: [business.api, school.api]
  AbmApiBaseUrl:
    Type: String
    Description: API base URL. Use https://api-school.apple.com for Apple School Manager.
    Default: https://api-business.apple.com
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
  AuthMode:
    Type: String
    Description: >-
      How Function URL callers authenticate. BearerToken (default, used by Nexthink):
      callers send "Authorization: Bearer <token>" matching the token secret.
      AwsIam: callers sign requests with AWS SigV4 and need IAM invoke permission.
    Default: BearerToken
    AllowedValues: [BearerToken, AwsIam]
  AuthTokenSecretId:
    Type: String
    Description: >-
      Name (not ARN) of the Secrets Manager secret holding the caller bearer token as
      {"token": "..."}, e.g. abm/nexthink-bearer-token. Required when AuthMode is BearerToken.
    Default: ''
    AllowedPattern: '^[A-Za-z0-9/_+=.@-]*$'

Rules:
  BearerTokenNeedsSecret:
    RuleCondition: !Equals [!Ref AuthMode, BearerToken]
    Assertions:
      - Assert: !Not [!Equals [!Ref AuthTokenSecretId, '']]
        AssertDescription: AuthTokenSecretId is required when AuthMode is BearerToken.

Conditions:
  UseBearerToken: !Equals [!Ref AuthMode, BearerToken]

Resources:
  DeviceLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          ABM_SECRET_ID: !Ref SecretId
          ABM_SCOPE: !Ref AbmScope
          ABM_API_BASE_URL: !Ref AbmApiBaseUrl
          # Empty disables the token check (AwsIam mode).
          AUTH_TOKEN_SECRET_ID: !If [UseBearerToken, !Ref AuthTokenSecretId, '']
      FunctionUrlConfig:
        # BearerToken mode: the URL is reachable without AWS signing, and the
        # function itself rejects any request without a valid token (401).
        AuthType: !If [UseBearerToken, NONE, AWS_IAM]
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              # Secrets Manager appends a 6-character suffix to secret ARNs.
              Resource:
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretId}-??????'
                - !If
                  - UseBearerToken
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AuthTokenSecretId}-??????'
                  - !Ref AWS::NoValue

  # A Function URL without AWS signing (BearerToken mode) needs both of these
  # resource-based permissions.
  PublicUrlInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: UseBearerToken
    Properties:
      FunctionName: !Ref DeviceLookupFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  PublicUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseBearerToken
    Properties:
      FunctionName: !Ref DeviceLookupFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  DeviceLookupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DeviceLookupFunction}'
      RetentionInDays: 30

Outputs:
  FunctionUrl:
    Description: Function URL. Callers need a bearer token (BearerToken mode) or SigV4 signing (AwsIam mode).
    Value: !GetAtt DeviceLookupFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref DeviceLookupFunction
